<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión - Barber Yander</title>
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/login.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- ===== ENCABEZADO / NAVBAR (HOMOLOGADO) ===== -->
  <header class="navbar">
    <div class="logo">
      <img src="img/banner.jpeg" alt="Logo Barber Yander">
      <h1>Barber Yander</h1>
    </div>
    <nav>
      <a href="index.html">Inicio</a>

      <div class="dropdown">
        <button class="dropbtn">Servicios ▾</button>
        <div class="dropdown-content">
          <a href="index.html#servicios-barba">Barba</a>
          <a href="index.html#servicios-corte">Corte</a>
          <a href="index.html#servicios-combos">Combos</a>
          <a href="index.html#servicios-cejas">Cejas</a>
          <a href="index.html#servicios-tintura">Tintura</a>
          <a href="index.html#servicios-premium">Servicio Premium</a>
        </div>
      </div>

      <a href="muestra_trabajo.html">Galería</a>
      <a href="login.html" class="login-link">Iniciar Sesión</a>
    </nav>
  </header>

  <div class="login-container">
    <div class="login-box">
      <h2>Iniciar Sesión</h2>
      <p class="subtitle">Accede a tu cuenta para gestionar tus citas</p>

      <form id="loginForm" autocomplete="on">
        <div class="input-group">
          <label for="usuario">Correo electrónico</label>
          <input type="email" id="usuario" name="usuario" placeholder="correo@ejemplo.com" maxlength="100" autocomplete="email" required>
        </div>
        <div class="input-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" maxlength="50" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-login" id="btnSubmitLogin">Iniciar Sesión</button>
      </form>

      <div class="forgot-password">
        <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
      </div>
      <div class="register-link">
        ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
      </div>
    </div>
  </div>

  <script src="js/notificaciones.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
